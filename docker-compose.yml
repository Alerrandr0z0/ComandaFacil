services:
  postgres:
    image: postgres:16-alpine
    container_name: comandafacil_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comandafacil}
      POSTGRES_USER: ${POSTGRES_USER:-comandafacil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comandafacil} -d ${POSTGRES_DB:-comandafacil}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: comandafacil_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-comandafacil}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-change_me_in_production}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-comandafacil_read}
    volumes:
      - mongo_data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2
    container_name: comandafacil_mongo_express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-comandafacil}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-change_me_in_production}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-comandafacil}:${MONGO_PASSWORD:-change_me_in_production}@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
